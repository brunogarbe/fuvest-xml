[project]
name = "fuvest-xml"
version = "0.1.0"
description = "Tools for validating, converting, formatting, and indexing Fuvest XML exams"
readme = "README.md"
authors = [
    { name = "Bruno Garbe Junior", email = "brunogarbe@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "colorama>=0.4.6",
    "lxml>=6.1.1",
    "pandas>=2.3.3",
    "pyqt5>=5.15.11",
    "pyqt5-qt5==5.15.2; sys_platform == 'win32'",
    "pymupdf>=1.26.0",
    "tabulate>=0.9.0",
    "typer>=0.16.0",
    "typing-extensions>=4.15.0",
]

[project.scripts]
fuvest-xml = "fuvest_xml.convert:main"
fuvest-xml-convert = "fuvest_xml.convert:main"
fuvest-xml-convert-legacy = "fuvest_xml.convert_xml:main"
fuvest-xml-db = "fuvest_xml.database:main"
fuvest-xml-format = "fuvest_xml.pretty_print:main"
fuvest-xml-gui = "fuvest_xml.gui:main"
fuvest-xml-read-pdfs = "fuvest_xml.read_pdfs:main"
fuvest-xml-validate = "fuvest_xml.validate:main"

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = ["src/old"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
